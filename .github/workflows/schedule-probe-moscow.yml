name: Schedule diagnostic moscow
on:
  schedule:
    - cron: '*/5 * * * *'
      timezone: 'Europe/Moscow'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ib19-schedule-diagnostic-moscow
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record scheduler event
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          node -e 'console.log(JSON.stringify({event:process.env.EVENT,schedule:process.env.SCHEDULE,runId:process.env.RUN_ID,actor:process.env.ACTOR,sha:process.env.SHA,observedAt:new Date().toISOString()}))'
