name: Update judging data
on:
  schedule:
    - cron: '0 * * * *'
      timezone: 'Europe/Moscow'
    # Off-peak fallback if GitHub drops/delays the top-of-hour event.
    - cron: '17 * * * *'
      timezone: 'Europe/Moscow'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ib19-publish
  cancel-in-progress: false
jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: gate
        env:
          UPDATE_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/update-gate.mjs
  update:
    needs: freshness
    if: needs.freshness.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run update
      - run: npm run validate
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Commit validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update judging data and history'
            git push
          fi
      # GITHUB_TOKEN push does not trigger deploy.yml: publish explicitly in this job.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
